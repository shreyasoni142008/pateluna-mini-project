<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pateluna - Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      font-family: Georgia, serif;
      background-color: #21577a;
      background-image: 
        radial-gradient(circle at 88% 22%, rgba(242, 165, 114, 0.92) 0%, rgba(242, 165, 114, 0.92) 26%, transparent 26.5%),
        radial-gradient(circle at 82% 45%, #df9264 0%, #df9264 46%, transparent 46.5%),
        radial-gradient(circle at 15% 88%, #dfb8a4 0%, #dfb8a4 38%, transparent 38.5%);
      color: #111;
    }
    .page-title {
      font-size: clamp(1.6rem, 3vw, 2.3rem);
      font-weight: 500;
      line-height: 1.3;
    }
    .address-card {
      background: #d9d9d9;
      padding: 14px 20px;
      max-width: 460px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .dot-dark {
      width: 28px;
      height: 28px;
      background: #14222b;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .payment-pill {
      background: #fff;
      border-radius: 50rem;
      padding: 8px 18px;
      max-width: 260px;
      display: flex;
      align-items: center;
      gap: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .radio-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #d9d9d9;
      flex-shrink: 0;
      transition: 0.2s;
    }
    .payment-pill.active .radio-dot {
      background: #14222b;
    }
    .summary-img {
      width: 95px;
      height: 115px;
      object-fit: cover;
      background: #fff;
    }
    .total-box {
      background: #d9d9d9;
      padding: 18px 24px;
      width: 100%;
      max-width: 290px;
    }
    .place-order-btn {
      background: #d9d9d9;
      border: 0;
      padding: 8px 20px;
      width: 100%;
      max-width: 290px;
      text-align: left;
      font-weight: 600;
      box-shadow: 4px 5px 8px rgba(0, 0, 0, 0.35);
      transition: 0.2s;
    }
    .place-order-btn:hover {
      background: #fff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="d-flex align-items-center">
  <main class="container py-4">
    <div class="row align-items-center g-4">
      <div class="col-md-7">
        <h1 class="page-title mb-4">Checkout ...<br>Complete your order</h1>
        <div class="address-card mb-4">
          <div class="dot-dark"></div>
          <div style="font-size: 0.9rem; font-weight: 600;">
            <div>Home</div>
            <div>123, Sanchar Vihar</div>
            <a href="#" class="text-dark text-decoration-none">Change Address &rarr;</a>
          </div>
        </div>
        <h5 class="fw-bold mb-3">Payment Method ...</h5>
        <div class="payment-pill active mb-2" onclick="selectPayment(this)">
          <div class="radio-dot"></div>
          <span>UPI Payment</span>
        </div>
        <div class="payment-pill mb-4" onclick="selectPayment(this)">
          <div class="radio-dot"></div>
          <span>Cash on Delivery</span>
        </div>
        <h6 class="fw-bold mb-2">Order Summary</h6>
        <div class="d-flex gap-4 flex-wrap">
          <div>
            <img src="images/stat1.png" alt="The Blue Castle" class="summary-img d-block mb-1">
            <small class="fw-bold">₹120</small>
          </div>
          <div>
            <img src="images/stat9.png" alt="Bookmarks" class="summary-img d-block mb-1">
            <small class="fw-bold">₹55</small>
          </div>
          <div>
            <img src="images/stat7.png" alt="Stapler" class="summary-img d-block mb-1">
            <small class="fw-bold">₹100</small>
          </div>
        </div>
      </div>
      <div class="col-md-5 d-flex flex-column align-items-md-center">
        <div class="total-box mb-4">
          <h4 class="mb-2">Total Cost :</h4>
          <div class="fw-bold fs-5">₹275</div>
        </div>
        <button class="place-order-btn" onclick="placeOrder()">
          Place Order &nbsp; --&gt;
        </button>
        <a href="Welcome.html" class="text-dark fw-bold text-decoration-none mt-4">
          &larr; Back to Home
        </a>
      </div>
    </div>
  </main>
  <script>
    function selectPayment(el) {
      document.querySelectorAll('.payment-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
    }
    function placeOrder() {
      alert("Thank you! Your Pateluna order (₹275) has been placed successfully.");
      window.location.href = "Welcome.html";
    }
  </script>
</body>
</html>
