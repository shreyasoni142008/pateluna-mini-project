<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pateluna - Covers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #dfe8dc url("images/bookshelf.jpeg") center / cover fixed no-repeat;
      font-family: Georgia, serif;
    }
    .panel { background: #d9d9d9; padding: 24px; }
    .cover-img { width: 130px; height: 175px; object-fit: cover; }
    .add-btn { width: 130px; border: 0; background: #fff; text-align: left; }
    .add-btn.added { background: #1f4a41; color: #fff; }
    .swatches { background: #fff; padding: 10px; }
    .chip { height: 50px; border: 3px solid transparent; cursor: pointer; }
    .chip.selected { border-color: #1a5cff; }
    .personal { background: #f4f2dc; padding: 20px; }
  </style>
</head>
<body>
  <main class="container py-4">
    <div class="panel">
      <div class="row text-center mb-4">
        <div class="col">
            <a href="home.html" class="btn btn-dark">&larr; Back to Home</a>
          <img class="cover-img" src="images/cover1.png" alt="The Blue Castle"><br>
          <button class="add-btn">+ Add</button>
        </div>
        <div class="col">
          <img class="cover-img" src="images/cover2.png" alt="Little Women"><br>
          <button class="add-btn">+ Add</button>
        </div>
        <div class="col">
          <img class="cover-img" src="images/cover3.png" alt="The Garden of Our Hearts"><br>
          <button class="add-btn">+ Add</button>
        </div>
        <div class="col">
          <img class="cover-img" src="images/cover4.png" alt="Once Upon a Time"><br>
          <button class="add-btn">+ Add</button>
        </div>
        <div class="col">
          <img class="cover-img" src="images/cover5.png" alt="Court of Envy"><br>
          <button class="add-btn">+ Add</button>
          <a href="checkout.html" class="btn btn-dark">Checkout</a>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-lg-7">
          <div class="swatches">
            <div class="row row-cols-5 g-2 text-center">
              <div class="col"><div class="chip" style="background:#5b6130"></div>Olive</div>
              <div class="col"><div class="chip" style="background:#24412f"></div>Forest</div>
              <div class="col"><div class="chip" style="background:#6e1f2a"></div>Burgundy</div>
              <div class="col"><div class="chip" style="background:#a8481f"></div>Rust</div>
              <div class="col"><div class="chip" style="background:#c48a1a"></div>Ochre</div>
              <div class="col"><div class="chip" style="background:#1f3342"></div>Inky Blue</div>
              <div class="col"><div class="chip" style="background:#2f5a5a"></div>Teal</div>
              <div class="col"><div class="chip" style="background:#6a3d1b"></div>Tobacco</div>
              <div class="col"><div class="chip" style="background:#4a2a1a"></div>Chocolate</div>
              <div class="col"><div class="chip" style="background:#2b2f2c"></div>Charcoal</div>
              <div class="col"><div class="chip" style="background:#5e2f40"></div>Plum</div>
              <div class="col"><div class="chip" style="background:#b2675f"></div>Dusty Rose</div>
              <div class="col"><div class="chip" style="background:#9a8468"></div>Taupe</div>
              <div class="col"><div class="chip" style="background:#e6d5b8"></div>Parchment</div>
              <div class="col"><div class="chip" style="background:#6d8268"></div>Sage</div>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="personal">
            <h2 class="h4">Personalized Cover</h2>
            <p>Enter text you want on your cover page</p>
            <input type="text" class="form-control rounded-pill" placeholder="Text here ...">
          </div>
        </div>
      </div>
    </div>
  </main>
  <script>
    var buttons = document.querySelectorAll(".add-btn");
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        btn.classList.toggle("added");
        if (btn.classList.contains("added")) {
          btn.textContent = "Added";
        } else {
          btn.textContent = "+ Add";
        }
      });
    });
    var chips = document.querySelectorAll(".chip");
    chips.forEach(function (chip) {
      chip.addEventListener("click", function () {
        chips.forEach(function (c) { c.classList.remove("selected"); });
        chip.classList.add("selected");
      });
    });
  </script>
</body>
</html>
