<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pateluna - Stationery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #dfe8dc url("images/bookshelf.jpeg") center / cover fixed no-repeat;
      font-family: Georgia, serif;
    }
    .panel { background: #d9d9d9; padding: 24px; border-radius: 12px; }
    .item-img { width: 130px; height: 130px; object-fit: cover; }
    .item-name { font-size: 1.5rem; margin: 6px 0 4px; }
    .item-price { background: #fff; display: inline-block; padding: 2px 10px; }
  </style>
</head>
<body>
  <main class="container py-4">
    <div class="mb-3">
      <a href="Welcome.html" class="btn btn-dark">&larr; Back to Home</a>
    </div>

    <div class="panel">
      <div class="row row-cols-2 row-cols-md-5 g-4 text-center">
        <div class="col">
          <img class="item-img" src="images/stat1.png" alt="Pencils">
          <div class="item-name">Pencils</div>
          <div class="item-price">₹10 <small>(each)</small></div>
        </div>
        <div class="col">
          <img class="item-img" src="images/stat2.png" alt="Scales">
          <div class="item-name">Scales</div>
          <div class="item-price">₹15 <small>(each)</small></div>
        </div>
        <div class="col">
          <img class="item-img" src="images/stat3.png" alt="Pens">
          <div class="item-name">Pens</div>
          <div class="item-price">₹25 <small>(each)</small></div>
        </div>
        <div class="col">
          <img class="item-img" src="images/stat4.png" alt="Holders">
          <div class="item-name">Holders</div>
          <div class="item-price">₹100 <small>(each)</small></div>
        </div>
        <div class="col">
          <img class="item-img" src="images/statt5.png" alt="Highlighters">
          <div class="item-name">Highlighters</div>
          <div class="item-price">₹60 <small>(each)</small></div>
        </div>
        <div class="col">
          <img class="item-img" src="images/stat6.png" alt="Erasers">
          <div class="item-name">Erasers</div>
          <div class="item-price">₹10 <small>(each)</small></div>
        </div>
        <div class="col">
          <img class="item-img" src="images/stat7.png" alt="Stapler">
          <div class="item-name">Stapler</div>
          <div class="item-price">₹100 <small>(each)</small></div>
        </div>
        <div class="col">
          <img class="item-img" src="images/stat8.png" alt="Whitener">
          <div class="item-name">Whitener</div>
          <div class="item-price">₹55 <small>(each)</small></div>
        </div>
        <div class="col">
          <img class="item-img" src="images/stat9.png" alt="Sticky notes">
          <div class="item-name">Sticky notes</div>
          <div class="item-price">₹45 <small>(each)</small></div>
        </div>
        <div class="col">
          <img class="item-img" src="images/stat10.png" alt="Stickers">
          <a href="checkout.html" class="btn btn-dark">Checkout</a>
          <div class="item-name">Stickers</div>
          <div class="item-price">₹35 <small>(each)</small></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
