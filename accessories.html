<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pateluna - Accessories</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #dfe8dc url("images/bookshelf.jpeg") center / cover fixed no-repeat;
      font-family: Georgia, serif;
    }
    .panel { background: #d9d9d9; padding: 24px; }
    .acc-img { width: 130px; height: 175px; object-fit: cover; }
    .add-btn { width: 130px; border: 0; background: #fff; text-align: left; }
    .add-btn.added { background: #1f4a41; color: #fff; }
    .personal { background: #f4f2dc; padding: 20px; }
    .sample-img { width: 120px; height: 130px; object-fit: cover; }
  </style>
</head>
<body>
    <a href="home.html" class="btn btn-dark">&larr; Back to Home</a>
  <main class="container py-4">
    <div class="panel">
      <div class="row text-center mb-4">
        <div class="col">
          <img class="acc-img" src="images/acc1.png" alt="Charm bookmarks"><br>
          <button class="add-btn">+ Add</button>
        </div>
        <div class="col">
          <img class="acc-img" src="images/acc2.png" alt="Mystic bookmarks"><br>
          <button class="add-btn">+ Add</button>
        </div>
        <div class="col">
          <img class="acc-img" src="images/acc3.png" alt="Flower bookmarks"><br>
          <button class="add-btn">+ Add</button>
        </div>
        <div class="col">
          <img class="acc-img" src="images/acc4.png" alt="Feather bookmarks"><br>
          <button class="add-btn">+ Add</button>
          <a href="checkout.html" class="btn btn-dark">Checkout</a>
        </div>
      </div>
      
      <div class="personal">
        <div class="row align-items-center">
          <div class="col-md-8">
            <h2 class="h3">Personalized Accessories</h2>
            <p class="mb-1">provide image ...</p>
            <input type="file" class="form-control form-control-sm mb-2" accept="image/*">
            <input type="text" class="form-control form-control-sm rounded-pill" placeholder="Text here ...">
          </div>
          <div class="col-md-4 text-center mt-3 mt-md-0">
            <img class="sample-img" src="images/1.png" alt="Personalized bookmark sample">
          </div>
        </div>
      </div>
    </div>
  </main>
  <script>
    var buttons = document.querySelectorAll(".add-btn");
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        btn.classList.toggle("added");
        if (btn.classList.contains("added")) {
          btn.textContent = "Added";
        } else {
          btn.textContent = "+ Add";
        }
      });
    });
  </script>
</body>
</html>
