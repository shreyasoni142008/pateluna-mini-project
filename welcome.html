<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookstore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #dfe8dc;  
      font-family: "Cormorant Garamond", Georgia, serif;
    }
    .page-img {
  width: min(70vh, 90vw); 
  aspect-ratio: 1 / 1;   
  object-fit: cover;   
  object-position: center 40%;
}
    .enter-btn {
      background: #1f4a41;
      color: #f3e6c4;
      border: 2px solid #c9a96b;
      font-size: 1.4rem;
      font-weight: 600;
      padding: .5rem 2.5rem;
      border-radius: 50rem;
    }
    .enter-btn:hover,
    .enter-btn:focus-visible {
      background: #163a33;
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="container min-vh-100 d-flex flex-column align-items-center justify-content-center py-3">
<img src="images/petaluna.png.png" alt="Petaluna bookstore" class="page-img">
    <a href="home.html" class="btn enter-btn mt-3">Enter the Bookstore</a>
  </main>
</body>
</html>
