<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pateluna - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(90deg, #f0995f 0%, #b3b5b8 50%, #05436e 90%);
      font-family: Georgia, serif;
    }
    .login-box {
      background: rgba(255, 255, 255, .25);
      border-radius: 40px;
      padding: 30px;
      width: 100%;
      max-width: 700px;
    }
    .book {
      background: #e0cfc0;
      border-radius: 12px;
      box-shadow: 8px 10px 14px rgba(0, 0, 0, .4);
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .book span {
      font-family: "Great Vibes", cursive;
      font-size: 2.6rem;
      color: #8b5a6b;
    }
    .line-input {
      border: 0;
      border-bottom: 1px solid #1c3b52;
      border-radius: 0;
      background: transparent;
    }
    .line-input:focus {
      background: transparent;
      box-shadow: none;
      border-bottom-color: #05436e;
    }
    .login-btn {
      background: linear-gradient(#58a5cc, #1f6b94);
      border: 0;
      border-radius: 50rem;
      font-size: 1.6rem;
      box-shadow: 6px 8px 10px rgba(0, 0, 0, .35);
    }
    .small-link { color: #fff; text-decoration: none; }
    .small-link:hover { text-decoration: underline; color: #fff; }
  </style>
</head>
<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="login-box">
      <div class="row align-items-center g-4">
        <div class="col-md-5">
          <div class="book"><span>Pateluna</span></div>
        </div>
        <div class="col-md-7">
          <h1 class="display-4">Login</h1>
          <form action="Welcome.html">
            <input type="email" class="form-control line-input mb-4" placeholder="Email">
            <input type="password" class="form-control line-input mb-4" placeholder="Password">
            <button type="submit" class="btn login-btn w-100 py-2">Login</button>
          </form>
          <div class="d-flex justify-content-between mt-3">
            <a href="signup.html" class="small-link">Create Account</a>
            <a href="forgot.html" class="small-link">Forgot Password ?</a>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
