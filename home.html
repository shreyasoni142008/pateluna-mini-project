<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pateluna - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: #dfe8dc url("images/bookshelf.png") center / cover no-repeat;
      font-family: "Cormorant Garamond", Georgia, serif;
      background: #dfe8dc url("images/bookshelf.jpeg") center / cover no-repeat;
    }
    .face {
      width: min(460px, 90vw);
    }
    .face-top {
      position: relative;
      height: 150px;
      background: #e0cbb8;
      border-radius: 150px 150px 30px 30px;
      box-shadow: 6px 8px 12px rgba(0, 0, 0, .3);
    }
    .eyes {
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 18px;
    }
    .eye {
      width: 54px;
      height: 54px;
      background: #fff;
      border-radius: 50%;
      border: 2px solid #ddd;
      position: relative;
    }
    .eye::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      background: #111;
      border-radius: 50%;
      top: 12px;
      left: 12px;
    }
    .menu a {
      color: #111;
      text-decoration: none;
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      font-weight: 600;
    }
    .menu a:hover,
.menu a:focus-visible,
.menu a.clicked {
  color: #1a5cff;
  font-style: italic;
  font-weight: 700;
}
    .face-bottom {
      height: 140px;
      background: #e0cbb8;
      border-radius: 30px 30px 150px 150px;
      box-shadow: 6px 8px 12px rgba(0, 0, 0, .3);
    }
    .logo {
      font-family: "Great Vibes", cursive;
      font-size: 2.6rem;
      color: #8b5a6b;
    }
  </style>
</head>
<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-3">
    <div class="face">
      <div class="face-top">
        <div class="eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
      </div>
      <nav class="menu d-flex justify-content-center gap-4 py-3">
        <a href="covers.html">Covers</a>
        <a href="accessories.html">Accessories</a>
        <a href="stationary.html">Stationery</a>
      </nav>
      <div class="face-bottom d-flex align-items-center justify-content-center">
        <span class="logo">Pateluna</span>
      </div>
    </div>
    <script>
  document.querySelectorAll(".menu a").forEach(function (link) {
    link.addEventListener("click", function (e) {
      e.preventDefault();
      link.classList.add("clicked");
      setTimeout(function () { window.location.href = link.href; }, 400);
    });
  });
</script>
  </main>
</body>
</html>
